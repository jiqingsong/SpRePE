full_field: &BASE_CONFIG

    # metadata file for the dataset
    metadata_json_path: 

    # data 
    train_data_path:
    valid_data_path: 
    exp_dir: 
    n_years: 1
    img_shape_x: 64
    img_shape_y: 64
    n_history: -1
    channel_weights: 'auto'
    # files used for normalization of the data

    # training parameters
    loss: "crossentropy"
    lr: 5e-4
    n_train_samples_per_epoch: 60000
    n_eval_samples: 10000
    max_epochs: 20
    weight_decay: 0.05

    # scheduler settings
    scheduler: "CosineAnnealingLR" # "ReduceLROnPlateau"
    scheduler_T_max: 20
    lr_warmup_steps: 5
    lr_start: 0.1

    # dropouts
    path_drop_rate: 0.
    mlp_drop_rate: 0.
    attn_drop_rate: 0.

    # wireup stuff
    wireup_info: "mpi"
    wireup_store: "tcp"

    num_data_workers: 1

    ics_type: "specify_number"
    save_raw_forecasts: !!bool True
    save_channel: !!bool False
    masked_acc: !!bool False
    maskpath: None
    perturb: !!bool False
    add_noise: !!bool False
    noise_std: 0.

    # network related
    nettype: "ViT"
    depth: 8
    model_grid_type: "equiangular"
    patch_size: [4, 4]
    num_heads: 8
    embed_dim: 384
    normalization_layer: "layer_norm"
    pos_embed_scheme: 'sprepe'

    #options default, residual
    target: "default" 

    normalization: "zscore" #options zscore or minmax
    hard_thresholding_fraction: 1.0
  
    # extra channels
    add_grid: !!bool False
    gridtype: "sinusoidal"
    grid_num_frequencies: 16
    roll: !!bool False
    add_zenith: !!bool False
    # invariants
    add_orography: !!bool False
    orography_path: 
    add_landmask: !!bool False
    landmask_path: 


    finetune: !!bool False

    log_to_screen: !!bool True
    log_to_wandb: !!bool True
    log_video: 10 # if > 0 will log every i-th epoch
    save_checkpoint: !!bool True

    optimizer_type: "Adam"
    optimizer_beta1: 0.9
    optimizer_beta2: 0.999
    optimizer_max_grad_norm: 1.0 


vit_73ch: &VIT_73CH
    <<: *BASE_CONFIG
    max_epochs: 20